button{font:inherit;cursor:pointer}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}

/* sidebar */
aside{position:sticky;top:0;height:100vh;overflow-y:auto;padding:30px 18px 20px;border-right:1px solid var(--line);
  background:rgba(250,246,244,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;flex-direction:column;gap:22px}
.logo{font-family:var(--serif);font-size:40px;letter-spacing:12px;font-weight:500;line-height:1;padding-left:6px}
.logo small{display:block;font-size:11px;letter-spacing:4px;color:var(--muted);margin-top:10px;font-weight:600}
.logo .rule{width:34px;height:1px;background:var(--ink2);margin:14px 0 0}
.navt{font-family:var(--serif);font-size:12px;letter-spacing:3px;color:var(--muted);font-weight:600;margin:0 0 6px 8px}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;justify-content:space-between;align-items:center;background:none;border:0;color:var(--ink2);
  padding:9px 10px;border-radius:8px;font-size:14px;text-align:left;width:100%}
nav button:hover{background:rgba(255,255,255,.35)}
nav button.on{background:var(--dark);color:#f6f1ef}
nav button .c{font-family:var(--serif);font-size:15px;opacity:.75}
.side-actions{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.btn{border:1px solid var(--ink2);background:transparent;color:var(--ink);padding:10px 14px;border-radius:999px;font-size:14px;letter-spacing:1px}
.btn:hover{background:rgba(255,255,255,.4)}
.btn.dark{background:var(--dark);border-color:var(--dark);color:#f6f1ef}
.btn.dark:hover{background:#000}
.sync{font-size:12px;color:var(--muted);line-height:1.6;padding:0 4px}
.sync b{color:var(--ink2);font-weight:500}
.sync .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:#9a908e}
.sync.on .dot{background:var(--ok)}
.sync a{color:var(--ink2);cursor:pointer;text-decoration:underline}

/* main */
main{padding:26px 26px 50px;min-width:0}
.topbar{display:none}
.title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.title h2{font-family:var(--serif);font-weight:500;font-size:26px;letter-spacing:4px;margin:0}
.title span{font-size:12px;letter-spacing:3px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.stat b{display:block;font-family:var(--serif);font-size:38px;font-weight:500;line-height:1}
.stat small{color:var(--muted);letter-spacing:2px}
.stat.hot b{color:var(--late)}
.toolbar{margin:14px 0 18px;display:flex;flex-wrap:wrap;gap:8px}
input,select,textarea{font:inherit;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 12px;font-size:14px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink2)}
.toolbar input{flex:1 1 200px;width:auto}.toolbar select{flex:0 1 160px;width:auto}

.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.board.single{grid-template-columns:minmax(0,1fr)}
.board.gallery{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.upl{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:220px;border:1.5px dashed rgba(42,37,37,.4);border-radius:12px;background:rgba(250,246,244,.35);color:var(--ink2);font-size:14px;letter-spacing:3px;transition:background .15s}
.upl:hover{background:rgba(255,253,252,.7)}
.upl .plus{font-family:var(--serif);font-size:56px;line-height:1;font-weight:400;letter-spacing:0}
.board.single .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.col{background:var(--panel);border:1px solid var(--line);border-radius:16px;min-width:0;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);scroll-margin-top:16px}
.col.over{border-color:var(--ink);box-shadow:0 0 0 2px rgba(42,37,37,.15) inset}
.colhead{padding:13px 16px;display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line)}
.colhead .nm{font-weight:500;letter-spacing:3px}
.colhead .en{font-family:var(--serif);font-size:12px;letter-spacing:3px;color:var(--muted);margin-left:8px}
.colhead .n{font-family:var(--serif);font-size:20px;color:var(--ink2)}
.cards{padding:12px;display:flex;flex-direction:column;gap:12px;min-height:90px}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:20px 0;border:1px dashed var(--line);border-radius:12px;letter-spacing:1px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:grab;transition:transform .12s, box-shadow .12s;min-width:0}
.card:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(42,37,37,.08)}
.card.dragging{opacity:.4}
.card img{width:100%;aspect-ratio:4/3;object-fit:contain;display:block;background:rgba(255,255,255,.55)}
.cbody{padding:11px 13px}
.ctitle{font-weight:500;font-size:15px;margin:0 0 7px;word-break:break-word}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}
.tag{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);letter-spacing:1px}
.tag.p-high{background:var(--dark);color:#f6f1ef;border-color:var(--dark)}
.meta{font-size:12px;color:var(--muted);word-break:break-word}
.due{font-size:12px;color:var(--muted)}
.due.late{color:var(--late);font-weight:700}.due.soon{color:var(--soon);font-weight:700}
.cfoot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:6px}
.move{display:flex;gap:4px}
.move button{border:1px solid var(--line);background:transparent;color:var(--ink2);padding:2px 9px;border-radius:999px;font-size:12px}
.move button:hover{background:#fff}

/* dialog */
dialog{background:#f4efed;color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(42,37,37,.4)}
.dhead{padding:18px 20px;border-bottom:1px solid var(--line);font-family:var(--serif);font-size:24px;letter-spacing:4px}
.dgrid{padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);letter-spacing:1px}
.full{grid-column:1/-1}
.preview{width:100%;max-height:340px;object-fit:contain;border-radius:10px;display:none;background:rgba(255,255,255,.6)}
.hlabel{font-size:12px;color:var(--muted);letter-spacing:1px;margin-bottom:6px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.thumb{position:relative;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.65);padding:0;overflow:hidden;color:var(--ink2)}
.thumb img{width:100%;aspect-ratio:1;object-fit:contain;display:block}
.thumb .lb{display:block;font-size:10px;line-height:1.35;color:var(--muted);padding:3px 2px 4px;text-align:center}
.thumb.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.thumb .x{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:rgba(42,37,37,.75);color:#fff;font-size:12px;line-height:18px;text-align:center}
.board.gallery .empty{grid-column:1/-1}
.dfoot{padding:12px 20px 20px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.danger{color:var(--late);border-color:var(--late)}
.note{font-size:13px;color:var(--ink2);line-height:1.7;padding:16px 20px 0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--dark);color:#f6f1ef;padding:10px 20px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;z-index:99;letter-spacing:1px;font-size:14px}
.toast.on{opacity:1}
.scrim{display:none}

@media (max-width:1180px){ .board{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr)}
  aside{position:fixed;left:0;top:0;bottom:0;width:250px;z-index:50;transform:translateX(-100%);transition:transform .25s;background:rgba(236,229,227,.96)}
  aside.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(42,37,37,.3);z-index:40}
  main{padding:14px 16px 40px}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .topbar .mlogo{font-family:var(--serif);font-size:28px;letter-spacing:9px;font-weight:500}
  .iconbtn{border:1px solid var(--ink2);background:transparent;border-radius:10px;padding:7px 11px;font-size:16px;color:var(--ink)}
  .title{display:none}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:minmax(0,1fr)}
  .board.single .cards,.board.gallery{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .upl{min-height:170px}
  .dgrid{grid-template-columns:1fr}
  .toolbar input{flex:1 1 100%}
  .toolbar select{flex:1 1 0}
}
</style>
</head>
<body>
<div class="layout">
  <aside id="side">
    <div class="logo">QUAL<small>DESIGN PROGRESS</small><div class="rule"></div></div>
    <div>
      <p class="navt">目錄</p>
      <nav id="navStages"></nav>
    </div>
    <div>
      <p class="navt">快速篩選</p>
      <nav id="navQuick"></nav>
    </div>
    <div id="seriesBox">
      <p class="navt">系列</p>
      <nav id="navSeries"></nav>
    </div>
    <div class="side-actions">
      <button class="btn dark" id="addBtn">＋ 新增款式</button>
      <button class="btn" id="xlsBtn">下載 Excel</button>
      <div class="sync" id="sync"></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main>
    <div class="topbar">
      <button class="iconbtn" id="menuBtn" aria-label="目錄">☰</button>
      <div class="mlogo">QUAL</div>
      <button class="iconbtn" id="addBtn2" aria-label="新增">＋</button>
    </div>
    <div class="title"><h2 id="viewTitle">首頁</h2><span>服飾設計進度表 · 從靈感到上架</span></div>

    <section class="stats">
      <div class="stat"><b id="sTotal">0</b><small>全部款式</small></div>
      <div class="stat"><b id="sDoing">0</b><small>進行中</small></div>
      <div class="stat hot"><b id="sLate">0</b><small>已逾期</small></div>
      <div class="stat"><b id="sDone">0</b><small>已上架</small></div>
    </section>

    <div class="toolbar">
      <input id="q" placeholder="搜尋款名、布料、備註…">
      <select id="fSeries"><option value="">全部系列</option></select>
      <select id="fPri"><option value="">全部優先度</option><option value="high">急件</option><option value="mid">一般</option><option value="low">不急</option></select>
    </div>

    <div class="board" id="board"></div>
  </main>
</div>

<dialog id="dlg">
  <form id="form">
    <div class="dhead" id="dTitle">新增款式</div>
    <div class="dgrid">
      <label class="full">款式名稱 *<input name="name" required placeholder="例：綁帶反摺短褲"></label>
      <label>系列<input name="series" list="seriesList" placeholder="例：2026 F/W"></label>
      <label>類別<select name="cat">
        <option>上衣</option><option>褲子</option><option>裙子</option><option>洋裝</option><option>外套</option><option>套裝</option><option>配件</option><option>其他</option>
      </select></label>
      <label>目前階段<select name="stage" id="stageSel"></select></label>
      <label>優先度<select name="pri"><option value="mid">一般</option><option value="high">急件</option><option value="low">不急</option></select></label>
      <label>截止日<input type="date" name="due"></label>
      <label id="verWrap">版本<select name="ver" id="verSel"></select></label>
      <label id="vdateWrap">日期<input type="date" name="vdate"></label>
      <label>負責人／工廠<input name="owner" placeholder="例：版師 小美"></label>
      <label class="full">布料／配色<input name="fabric" placeholder="例：黑色羅紋棉＋銀色鉚釘"></label>
      <label class="full">備註<textarea name="note" rows="3" placeholder="修改重點、尺寸、成本…"></textarea></label>
      <label class="full">款式圖（設計稿或樣衣照）<input type="file" id="imgInput" accept="image/*"></label>
      <img id="preview" class="preview full" alt="">
      <div class="full" id="histWrap"><div class="hlabel">歷史圖片（由舊到新，點一下設為封面）</div><div class="thumbs" id="thumbs"></div></div>
    </div>
    <div class="dfoot">
      <button type="button" class="btn danger" id="delBtn">刪除</button>
      <div style="display:flex;gap:8px;margin-left:auto">
        <button type="button" class="btn" id="cancelBtn">取消</button>
        <button type="submit" class="btn dark">儲存</button>
      </div>
    </div>
  </form>
</dialog>

<dialog id="teamDlg">
  <form id="teamForm">
    <div class="dhead">加入團隊</div>
    <p class="note">輸入團隊代碼（至少 8 個字），用同一個代碼的手機和電腦會看到同一份進度、即時同步。<br>代碼請只告訴要一起用的人。</p>
    <div class="dgrid"><label class="full">團隊代碼<input name="team" required minlength="8" placeholder="例：qual-studio-2026" autocomplete="off"></label></div>
    <div class="dfoot"><button type="button" class="btn" id="teamCancel">稍後</button><button type="submit" class="btn dark">加入</button></div>
  </form>
</dialog>

<input type="file" id="uplInput" accept="image/*" multiple hidden>
<datalist id="seriesList"></datalist>
<div class="toast" id="toast"></div>

<script type="module">
/* ============================================================
   同步設定：把 Firebase 給你的設定貼在這裡（貼好後所有裝置自動同步）
   沒貼的話，進度表會以「單機模式」運作，資料只存在這台裝置。
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCZR68TejLtHS_gjvAyXshwoban1hUrmt0",
  authDomain: "qual-acd88.firebaseapp.com",
  projectId: "qual-acd88",
  storageBucket: "qual-acd88.firebasestorage.app",
  messagingSenderId: "409553220993",
  appId: "1:409553220993:web:e1865096766fb4a34e2480"
};

const STAGES = [
  {k:'idea',   n:'靈感',   en:'IDEA'},
  {k:'sketch', n:'設計中', en:'DESIGNING'},
  {k:'sample', n:'打樣',   en:'SAMPLE'},
  {k:'live',   n:'上架',   en:'LAUNCH'}
];
const OLD_MAP = {pattern:'sample',fabric:'sample',fix:'sample',prod:'live'};
const PRI = {high:'急件',mid:'一般',low:'不急'};
const LKEY = 'design-tracker-v1', TKEY = 'qual-team';
const $ = id => document.getElementById(id);

let items = [], view = 'all', editingId = null, pendingImg = null, pendingHist = [];
let cloud = null; // {db, fs, team}

/* ---------- utils ---------- */
const ls = { get(k){ try{return localStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{localStorage.setItem(k,v);return true}catch(e){return false} } };
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'),2400); }
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const fixStage = it => { if(OLD_MAP[it.stage]) it.stage = OLD_MAP[it.stage]; if(!STAGES.some(s=>s.k===it.stage)) it.stage='idea'; return it; };
function dueInfo(it){
  if(!it.due || it.stage==='live') return null;
  const days = Math.round((new Date(it.due+'T00:00:00') - today())/86400000);
  if(days<0) return {cls:'late', t:`逾期 ${-days} 天`};
  if(days===0) return {cls:'soon', t:'今天截止'};
  if(days<=3) return {cls:'soon', t:`剩 ${days} 天`};
  return {cls:'', t:`截止 ${it.due.slice(5).replace('-','/')}`};
}
const newId = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ---------- storage layer ---------- */
function loadLocal(){ try{ return (JSON.parse(ls.get(LKEY))||[]).map(fixStage) }catch(e){ return [] } }
function saveLocal(){ if(!ls.set(LKEY, JSON.stringify(items))) toast('空間不足：請刪掉一些圖片'); }
async function upsert(it){
  it.updated = Date.now();
  if(cloud){
    const clean = Object.fromEntries(Object.entries(it).map(([k,v])=>[k, v===undefined?null:v]));
    try{ await cloud.fs.setDoc(cloud.fs.doc(cloud.db,'teams',cloud.team,'items',it.id), clean); }
    catch(e){ toast('同步失敗，請檢查網路'); console.error(e); }
  } else {
    const i = items.findIndex(x=>x.id===it.id);
    if(i>=0) items[i]=it; else items.push(it);
    saveLocal(); render();
  }
}
async function removeItem(id){
  if(cloud){ try{ await cloud.fs.deleteDoc(cloud.fs.doc(cloud.db,'teams',cloud.team,'items',id)); }catch(e){ toast('刪除失敗，請檢查網路'); } }
  else { items = items.filter(i=>i.id!==id); saveLocal(); render(); }
}

async function startCloud(team){
  const V='10.12.2';
  const app = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const fs  = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const fbApp = app.getApps().length ? app.getApp() : app.initializeApp(FIREBASE_CONFIG);
  const db = fs.getFirestore(fbApp);
  cloud = {db, fs, team};
  let first = true;
  fs.onSnapshot(fs.collection(db,'teams',team,'items'), snap=>{
    items = snap.docs.map(d=>fixStage({...d.data(), id:d.id}));
    if(first){ first=false; offerMigrate(snap.empty); }
    syncStatus(true); render();
  }, err=>{ console.error(err); syncStatus(false, '無法連線雲端（檢查代碼或規則）'); });
}
async function offerMigrate(cloudEmpty){
  const local = loadLocal().filter(i=>!String(i.id).startsWith('demo'));
  if(!local.length || ls.get('qual-migrated-'+cloud.team)) return;
  if(confirm(`這台裝置上有 ${local.length} 筆舊資料，要上傳到團隊雲端嗎？`)){
    for(const it of local) await upsert(it);
    toast('已上傳到雲端');
  }
  ls.set('qual-migrated-'+cloud.team,'1');
}
function syncStatus(ok, msg){
  const el=$('sync');
  if(!FIREBASE_CONFIG){ el.className='sync'; el.innerHTML='<span class="dot"></span><b>單機模式</b><br>尚未開啟雲端同步'; return; }
  if(!cloud){
    const t = ls.get(TKEY);
    if(t){ el.className='sync'; el.innerHTML=`<span class="dot"></span><b>${esc(msg||'連線中…')}</b><br>團隊：${esc(t)} · <a id="retryLink">重試</a>`; $('retryLink').onclick=()=>location.reload(); return; }
    el.className='sync'; el.innerHTML='<span class="dot"></span><b>未加入團隊</b><br><a id="joinLink">輸入團隊代碼</a>'; $('joinLink').onclick=askTeam; return;
  }
  el.className = ok ? 'sync on' : 'sync';
  el.innerHTML = `<span class="dot"></span><b>${ok?'雲端同步中':esc(msg||'連線中…')}</b><br>團隊：${esc(cloud.team)} · <a id="switchLink">切換</a>`;
  $('switchLink').onclick = ()=>{ if(confirm('要換到別的團隊代碼嗎？')){ try{localStorage.removeItem(TKEY)}catch(e){} location.reload(); } };
}
function askTeam(){ $('teamDlg').showModal(); }
$('teamCancel').onclick = ()=>$('teamDlg').close();
$('teamForm').addEventListener('submit', e=>{
  e.preventDefault();
  const t = new FormData(e.target).get('team').trim();
  if(t.length<8) return toast('代碼至少 8 個字');
  ls.set(TKEY, t); $('teamDlg').close(); syncStatus(false,'連線中…'); startCloud(t).catch(err=>{console.error(err); syncStatus(false,'雲端載入失敗');});
});

/* ---------- render ---------- */
$('stageSel').innerHTML = STAGES.map(s=>`<option value="${s.k}">${s.n}</option>`).join('');

function filtered(){
  const q = $('q').value.trim().toLowerCase(), fs = $('fSeries').value, fp = $('fPri').value;
  return items.filter(it =>
    (!fs || it.series===fs) && (!fp || it.pri===fp) &&
    (!q || [it.name,it.series,it.fabric,it.note,it.owner,it.cat].join(' ').toLowerCase().includes(q)) &&
    (view!=='late' || dueInfo(it)?.cls==='late') &&
    (view!=='high' || it.pri==='high'));
}
function render(){
  const list = filtered();
  const order = {high:0,mid:1,low:2};
  const stageView = STAGES.find(s=>s.k===view);
  const sortCards = arr => arr.sort((a,b)=>(order[a.pri]-order[b.pri]) || ((a.due||'9')>(b.due||'9')?1:-1));
  // 靈感／設計稿／打樣頁：沒有外框，只有上傳格＋款式
  if(stageView && stageView.k!=='live'){
    const cards = sortCards(list.filter(it=>it.stage===stageView.k));
    $('board').className = 'board gallery';
    $('board').innerHTML = `<button class="upl" data-upload="${stageView.k}"><span class="plus">+</span><span>上傳圖片</span></button>` + cards.map(card).join('');
    renderSide(stageView);
    return;
  }
  // 已逾期／急件：直接卡片
  if(view==='late' || view==='high'){
    const cards = sortCards(list);
    $('board').className = 'board gallery';
    $('board').innerHTML = cards.length ? cards.map(card).join('') : `<div class="empty">目前沒有${view==='late'?'逾期':'急件'}的款式</div>`;
    renderSide(stageView);
    return;
  }
  // 首頁：只留上架
  const shown = [STAGES[3]];
  $('board').className = 'board' + (shown.length===1 ? ' single' : '');
  $('board').innerHTML = shown.map(s=>{
    const idx = STAGES.indexOf(s);
    const cards = sortCards(list.filter(it=>it.stage===s.k));
    return `<section class="col" id="col-${s.k}" data-stage="${s.k}">
      <div class="colhead"><span><span class="nm">${s.n}</span><span class="en">${s.en}</span></span><span class="n">${cards.length}</span></div>
      <div class="cards">${cards.length? cards.map(card).join('') : `<div class="empty">${s.k==='live'?'還沒有上架的款式':'把款式拖到這裡'}</div>`}</div>
    </section>`;
  }).join('');
  renderSide(stageView);
}
function renderSide(stageView){
  $('sTotal').textContent = items.length;
  $('sDone').textContent  = items.filter(i=>i.stage==='live').length;
  $('sDoing').textContent = items.filter(i=>i.stage==='sketch'||i.stage==='sample').length;
  $('sLate').textContent  = items.filter(i=>dueInfo(i)?.cls==='late').length;

  const titles = {all:'首頁', late:'已逾期', high:'急件'};
  $('viewTitle').textContent = stageView ? stageView.n : titles[view];

  // sidebar
  const cnt = k => items.filter(i=>i.stage===k).length;
  $('navStages').innerHTML =
    `<button data-view="all" class="${view==='all'?'on':''}"><span>首頁</span><span class="c">${items.length}</span></button>` +
    STAGES.filter(s=>s.k!=='live').map(s=>`<button data-view="${s.k}" class="${view===s.k?'on':''}"><span>${s.n}</span><span class="c">${cnt(s.k)}</span></button>`).join('');
  $('navQuick').innerHTML =
    `<button data-view="late" class="${view==='late'?'on':''}"><span>已逾期</span><span class="c">${items.filter(i=>dueInfo(i)?.cls==='late').length}</span></button>` +
    `<button data-view="high" class="${view==='high'?'on':''}"><span>急件</span><span class="c">${items.filter(i=>i.pri==='high').length}</span></button>`;

  const series = [...new Set(items.map(i=>i.series).filter(Boolean))].sort();
  const fsVal = $('fSeries').value;
  $('fSeries').innerHTML = '<option value="">全部系列</option>' + series.map(s=>`<option ${s===fsVal?'selected':''}>${esc(s)}</option>`).join('');
  $('seriesList').innerHTML = series.map(s=>`<option value="${esc(s)}">`).join('');
  $('seriesBox').style.display = series.length ? '' : 'none';
  $('navSeries').innerHTML = series.map(s=>`<button data-series="${esc(s)}" class="${s===fsVal?'on':''}"><span>${esc(s)}</span><span class="c">${items.filter(i=>i.series===s).length}</span></button>`).join('');
}
const VER_STAGES = ['sketch','sample'];
function card(it){
  const d = dueInfo(it);
  const sent = it.stage==='idea' && items.some(x=>x.from===it.id);
  return `<article class="card" draggable="true" data-id="${esc(it.id)}">
    ${it.img?`<img src="${it.img}" alt="" loading="lazy">`:''}
    <div class="cbody">
      <p class="ctitle">${esc(it.name)}</p>
      <div class="tags">
        ${it.pri==='high'?`<span class="tag p-high">急件</span>`:''}
        <span class="tag">${esc(it.cat)}</span>
        ${it.series?`<span class="tag">${esc(it.series)}</span>`:''}
        ${VER_STAGES.includes(it.stage)&&it.ver?`<span class="tag">${esc(it.ver)}</span>`:''}
        ${sent?`<span class="tag">已送設計中</span>`:''}
      </div>
      ${it.stage==='sketch'&&it.vdate?`<div class="meta">日期　${esc(it.vdate.replace(/-/g,'/'))}</div>`:''}
      ${it.fabric?`<div class="meta">布料　${esc(it.fabric)}</div>`:''}
      ${it.owner?`<div class="meta">負責　${esc(it.owner)}</div>`:''}
      <div class="cfoot">
        <span class="due ${d?.cls||''}">${d?d.t:''}</span>
        <span class="move">
          ${it.stage!=='live'?`<button data-mv="1" title="${it.stage==='idea'?'複製到設計中':'推到下一階段'}">▶</button>`:''}
        </span>
      </div>
    </div>
  </article>`;
}

/* ---------- sidebar & mobile ---------- */
function closeSide(){ $('side').classList.remove('open'); $('scrim').classList.remove('open'); }
$('menuBtn').onclick = ()=>{ $('side').classList.add('open'); $('scrim').classList.add('open'); };
$('scrim').onclick = closeSide;
$('side').addEventListener('click', e=>{
  const v = e.target.closest('[data-view]'); const s = e.target.closest('[data-series]');
  if(v){ view = v.dataset.view; render(); closeSide(); window.scrollTo({top:0,behavior:'smooth'}); }
  if(s){ $('fSeries').value = $('fSeries').value===s.dataset.series ? '' : s.dataset.series; render(); closeSide(); }
});

/* ---------- board interactions ---------- */
function histOf(it){
  if(it.history && it.history.length) return it.history.map(h=>({...h}));
  return it.img ? [{img:it.img, ver:it.ver||'v1', st:it.stage, at:it.created||it.updated||Date.now()}] : [];
}
function moveTo(it, stage){
  if(it.stage===stage) return;
  const n = {...it, stage};
  if(stage==='sample'){ n.ver='v1'; n.history=histOf(it); }
  upsert(n);
  if(stage==='live') toast(`${it.name} 上架了`);
}
let uplStage = 'idea';
$('board').addEventListener('click', e=>{
  const u = e.target.closest('[data-upload]');
  if(u){ uplStage = u.dataset.upload; $('uplInput').click(); return; }
  const c = e.target.closest('.card'); if(!c) return;
  const it = items.find(i=>i.id===c.dataset.id); if(!it) return;
  const mv = e.target.closest('[data-mv]');
  if(mv){
    if(it.stage==='idea'){
      upsert({...it, id:newId(), created:Date.now(), stage:'sketch', ver:'v1', vdate:'', history:histOf(it), from:it.id});
      toast('已複製到設計中，靈感保留原樣');
      return;
    }
    const i = STAGES.findIndex(s=>s.k===it.stage) + 1; moveTo(it, STAGES[i].k); return;
  }
  openDlg(it);
});
$('board').addEventListener('dragstart', e=>{ const c=e.target.closest('.card'); if(!c) return; e.dataTransfer.setData('text/plain', c.dataset.id); c.classList.add('dragging'); });
$('board').addEventListener('dragend', e=>e.target.closest('.card')?.classList.remove('dragging'));
$('board').addEventListener('dragover', e=>{ const col=e.target.closest('.col'); if(!col) return; e.preventDefault(); document.querySelectorAll('.col.over').forEach(x=>x!==col&&x.classList.remove('over')); col.classList.add('over'); });
$('board').addEventListener('dragleave', e=>{ const col=e.target.closest('.col'); if(col && !col.contains(e.relatedTarget)) col.classList.remove('over'); });
$('board').addEventListener('drop', e=>{
  const col=e.target.closest('.col'); if(!col) return; e.preventDefault(); col.classList.remove('over');
  const it=items.find(i=>i.id===e.dataTransfer.getData('text/plain')); if(it) moveTo(it, col.dataset.stage);
});
['q','fSeries','fPri'].forEach(id=>$(id).addEventListener('input', render));

/* ---------- dialog ---------- */
const dlg=$('dlg'), form=$('form'), preview=$('preview');
const md = t => { const d=new Date(t); return `${d.getMonth()+1}/${d.getDate()}`; };
const stShort = {idea:'靈感',sketch:'設計',sample:'打樣',live:'上架'};
function fillVer(cur){
  const nums = [cur, ...pendingHist.map(h=>h.ver)].map(v=>parseInt(String(v||'').replace(/\D/g,''))||1);
  const max = Math.max(10, Math.max(...nums)+1);
  $('verSel').innerHTML = Array.from({length:max},(_,i)=>`<option>v${i+1}</option>`).join('');
  $('verSel').value = cur || 'v1';
}
function renderThumbs(){
  $('thumbs').innerHTML = pendingHist.map((h,i)=>`<div class="thumb ${h.img===pendingImg?'on':''}" data-i="${i}">
      <img src="${h.img}" alt=""><span class="lb">${esc(stShort[h.st]||'')} ${esc(h.ver||'')}<br>${md(h.at)}</span>
      <button type="button" class="x" data-del="${i}" title="刪除這張">×</button></div>`).join('');
  const st = form.elements.stage.value;
  $('histWrap').style.display = VER_STAGES.includes(st) && pendingHist.length ? '' : 'none';
}
function stageUI(){
  const st = form.elements.stage.value;
  $('verWrap').style.display = VER_STAGES.includes(st) ? '' : 'none';
  $('vdateWrap').style.display = st==='sketch' ? '' : 'none';
  renderThumbs();
}
function showPreview(){ preview.style.display = pendingImg ? 'block' : 'none'; preview.src = pendingImg || ''; }
function openDlg(it){
  editingId = it?.id || null; pendingImg = it?.img || null; pendingHist = it ? histOf(it) : [];
  form.reset();
  $('dTitle').textContent = it ? '編輯款式' : '新增款式';
  $('delBtn').style.visibility = it ? 'visible' : 'hidden';
  const v = it || {stage: STAGES.some(s=>s.k===view)?view:'idea', pri:'mid', cat:'上衣', series:$('fSeries').value};
  for(const k of ['name','series','cat','stage','pri','due','owner','fabric','note','vdate']) form.elements[k].value = v[k] || '';
  fillVer(v.ver || 'v1'); showPreview(); stageUI();
  closeSide(); dlg.showModal();
}
$('addBtn').onclick = ()=>openDlg(null);
$('addBtn2').onclick = ()=>openDlg(null);
$('cancelBtn').onclick = ()=>dlg.close();
$('delBtn').onclick = ()=>{ if(!confirm('確定刪除這個款式？')) return; removeItem(editingId); dlg.close(); };
form.addEventListener('submit', e=>{
  e.preventDefault();
  const data = Object.fromEntries(new FormData(form).entries());
  const base = editingId ? items.find(i=>i.id===editingId) : {id:newId(), created:Date.now()};
  const obj = {...base, ...data, img: pendingImg || null, history: pendingHist};
  if(JSON.stringify(obj).length > 900000) return toast('這個款式的圖片太多了，請刪掉幾張舊圖再儲存');
  upsert(obj);
  dlg.close(); toast('已儲存');
});
function compress(f){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onerror=rej;
    r.onload=()=>{ const im=new Image(); im.onerror=rej; im.onload=()=>{
      const s=Math.min(1, 640/Math.max(im.width,im.height)); const cv=document.createElement('canvas');
      cv.width=Math.round(im.width*s); cv.height=Math.round(im.height*s); cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      res(cv.toDataURL('image/jpeg',.72));
    }; im.src=r.result; };
    r.readAsDataURL(f);
  });
}
$('imgInput').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f) return;
  e.target.value='';
  try{
    pendingImg = await compress(f);
    pendingHist.push({img:pendingImg, ver:$('verSel').value||'v1', st:form.elements.stage.value, at:Date.now()});
    showPreview(); renderThumbs();
  }catch(_){ toast('這張圖片讀不了'); }
});
$('stageSel').addEventListener('change', stageUI);
$('thumbs').addEventListener('click', e=>{
  const del = e.target.closest('[data-del]');
  if(del){
    const [h] = pendingHist.splice(Number(del.dataset.del),1);
    if(h && h.img===pendingImg) pendingImg = pendingHist.length ? pendingHist[pendingHist.length-1].img : null;
    showPreview(); renderThumbs(); return;
  }
  const t = e.target.closest('[data-i]'); if(!t) return;
  pendingImg = pendingHist[Number(t.dataset.i)].img; showPreview(); renderThumbs();
});
$('uplInput').addEventListener('change', async e=>{
  const files=[...e.target.files]; e.target.value=''; if(!files.length) return;
  toast(`上傳中… (${files.length} 張)`);
  let n=0;
  for(const f of files){
    try{
      const img = await compress(f);
      await upsert({id:newId(), created:Date.now(), name:f.name.replace(/\.[^.]+$/,'') || '未命名', series:$('fSeries').value||'',
        cat:'其他', stage:uplStage, pri:'mid', due:'', owner:'', fabric:'', note:'', img, ver:'v1', vdate:'',
        history:[{img, ver:'v1', st:uplStage, at:Date.now()}]});
      n++;
    }catch(_){}
  }
  toast(n ? `已上傳 ${n} 張，點圖片可以改名稱和細節` : '圖片讀不了，請換一張');
});

/* ---------- Excel ---------- */
$('xlsBtn').onclick = ()=>{
  if(!window.XLSX) return toast('Excel 元件還在載入，請稍候再試');
  const fmt = t => t ? new Date(t).toLocaleDateString('zh-TW') : '';
  const sn = k => STAGES.find(s=>s.k===k)?.n || k;
  const rows = [...items].sort((a,b)=>STAGES.findIndex(s=>s.k===a.stage)-STAGES.findIndex(s=>s.k===b.stage))
    .map(it=>({'款式名稱':it.name,'系列':it.series||'','類別':it.cat||'','階段':sn(it.stage),'版本':VER_STAGES.includes(it.stage)?(it.ver||'v1'):'','日期':it.vdate||'','優先度':PRI[it.pri]||'',
      '截止日':it.due||'','狀態':dueInfo(it)?.t||'','負責人／工廠':it.owner||'','布料／配色':it.fabric||'','備註':it.note||'',
      '建立日期':fmt(it.created),'最後更新':fmt(it.updated)}));
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(rows.length?rows:[{'款式名稱':''}]);
  ws['!cols'] = [24,14,8,8,6,12,8,12,12,16,24,36,12,12].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb, ws, '全部款式');
  STAGES.forEach(s=>{
    const r = rows.filter(x=>x['階段']===s.n);
    if(r.length){ const w=XLSX.utils.json_to_sheet(r); w['!cols']=ws['!cols']; XLSX.utils.book_append_sheet(wb, w, s.n); }
  });
  XLSX.writeFile(wb, `QUAL設計進度-${new Date().toISOString().slice(0,10)}.xlsx`);
  toast('Excel 已下載');
};

/* ---------- start ---------- */
if(FIREBASE_CONFIG){
  const t = ls.get(TKEY);
  if(t){ syncStatus(false,'連線中…'); startCloud(t).catch(err=>{console.error(err); syncStatus(false,'雲端載入失敗');}); }
  else { syncStatus(false); askTeam(); }
  render();
} else {
  items = loadLocal();
  if(!items.length){
    const in5 = new Date(Date.now()+5*864e5).toISOString().slice(0,10);
    items = [
      {id:'demo1',name:'綁帶反摺短褲',series:'2026 F/W',cat:'褲子',stage:'sample',pri:'high',due:in5,owner:'版師',fabric:'黑色羅紋棉＋銀色鉚釘',note:'範例，可刪除',img:null},
      {id:'demo2',name:'草寫 Logo 腰頭',series:'2026 F/W',cat:'配件',stage:'sketch',pri:'mid',due:'',owner:'',fabric:'灰色印字',note:'',img:null}
    ];
  }
  saveLocal(); syncStatus(); render();
}
</script>
